<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ef2b22">
  <meta name="description" content="Life Happens — a mobile life simulator. Grow up, make choices, build a life, and see how your story ends.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life Happens">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Life Happens — Life Simulator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <section id="screen-title" class="screen title-screen" aria-label="Life Happens title screen"></section>
    <section id="screen-create" class="screen create-screen hidden" aria-label="Create your character"></section>
    <section id="screen-game" class="screen game hidden" aria-label="Your life">
      <header id="topbar" class="topbar"></header>
      <div class="game-main">
        <div id="identity" class="identity"></div>
        <main id="feed" class="feed scroll" aria-live="polite"></main>
        <div id="stats" class="stats-panel"></div>
        <section id="subpage" class="subpage hidden" aria-label="Menu page"></section>
      </div>
      <div id="age-dock" class="age-dock"></div>
      <nav id="bottomnav" class="bottomnav" aria-label="Main navigation"></nav>
    </section>
    <section id="screen-death" class="screen death-screen hidden" aria-label="Life summary"></section>
  </div>
  <div id="drawer-root" class="overlay-root"></div>
  <div id="sheet-root" class="overlay-root"></div>
  <div id="modal-root" class="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
